name: Bug report
description: Create a report to help masscan improve
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Please make sure your problem is not already addressed in another issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please give a clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Masscan version
      description: Output of `masscan --version`
      render: bash
      placeholder: |
        Masscan version 1.3.2 ( https://github.com/robertdavidgraham/masscan )
        Compiled on: Feb  2 2021 11:13:27
        Compiler: gcc 10.2.1 20210130
        OS: Linux
        CPU: unknown (64 bits)
        GIT version: unknown
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: How do you use masscan?

    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What is the expected behavior?
      placeholder: |
        E.g. "Masscan should support this feature that the binary does."
  - type: textarea
    id: additional
    attributes:
      label: Additional Info
      description: Additional info you want to provide such as system info, target info, network conditions etc.
    validations:
      required: false
